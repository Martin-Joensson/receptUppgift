<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Ett enkelt och gott recept på pannkakor."
    />
    <meta name="author" content="Martin Jönsson" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Enkla Pannkakor</title>
    <link rel="icon" type="image/x-icon" href="./assets/logo.svg" />
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=autour-one:400|open-sans:300,400,500,600,700,800|poppins:100,200,300,400,500,600,700,800,900"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header">
      <div class="header__container header__container--column">
        <a href="index.html" class="header__skip-link">
          Hoppa till huvudinnehåll
        </a>

        <a class="header__logo-link" href="#" aria-label="Gå till startsidan">
          <img
            src="./assets/logo.svg"
            alt=""
            width="60"
            height="60"
            class="header__logo-image"
          />
          <span class="header__logo-text">Ankans Recept</span>
        </a>

        <nav class="navigation" aria-label="Huvudnavigering">
          <ul class="navigation__list">
            <li class="navigation__item">
              <a href="index.html" class="navigation__link">Recept</a>
            </li>

            <li class="navigation__item">
              <a href="#about-us" class="navigation__link">Om oss</a>
            </li>

            <li class="navigation__item">
              <a href="sendrecipe.html" class="navigation__link"
                >Skicka recept till oss</a
              >
            </li>
          </ul>
        </nav>

        <a
          href="#"
          class="header__login-link"
          aria-label="Logga in på ditt konto"
        >
          <img
            src="./assets/login.svg"
            alt="Logga in"
            class="header__login-icon"
          />
        </a>
      </div>
    </header>

    <main>
      <div class="recipe-form">
        <div class="form-content">
          <div>
            <h2>Skicka in ett recept till oss!</h2>
          </div>
          <form action="#" method="POST">
            <div class="form-group">
              <label for="guest-email">Epost</label>
              <input
                type="email"
                name="email"
                id="guest-email"
                autocomplete="email"
                placeholder="Ex: Email@mail.com"
              />
            </div>

            <div class="form-group">
              <label for="visit-date"
                >När lagade du receptet första gången?</label
              >
              <input type="date" id="visit-date" name="visit_date" />
            </div>
            <div class="form-group">
              <label for="portions">Hur portioner räcker receptet till?</label>
              <select id="portions" name="portions">
                <option selected disabled>Välj ett alternativ</option>
                <option value="1">1 person</option>
                <option value="2">2 personer</option>
                <option value="3-5">3-5 personer</option>
                <option value="6+">Fler än 6 personer</option>
              </select>
            </div>
            <div class="form-group">
              <label for="rating"
                >Hur svårt är receptet på en skala mellan 1-10</label
              >
              <input
                type="range"
                id="rating"
                name="rating"
                min="0"
                max="10"
                step="1"
                list="rating-markers"
              />
              <div class="rating-labels">
                <span>1</span>
                <span>5</span>
                <span>10</span>
              </div>
            </div>
            <div class="form-group">
              <fieldset class="">
                <legend>
                  Är det första gången du skickar in ett recept till oss?
                </legend>
                <input
                  class=""
                  type="radio"
                  id="repeat-sender-yes"
                  name="repeat-sender"
                  value="yes"
                />
                <label for="repeat-sender-yes">Ja, första gången</label>
                <input
                  class=""
                  type="radio"
                  id="repeat-sender-no"
                  name="repeat-sender"
                  value="no"
                />
                <label for="repeat-sender-no">Nej, skickat in förut</label>
              </fieldset>
            </div>
            <div class="form-group">
              <fieldset class="">
                <legend>Hur lärde du dig receptet?</legend>
                <label>
                  <input type="checkbox" name="source" value="social" />
                  Sociala Medier
                </label>
                <label>
                  <input type="checkbox" name="source" value="google" />
                  Google
                </label>
                <label>
                  <input type="checkbox" name="source" value="friends" />
                  Vänner
                </label>
                <label>
                  <input type="checkbox" name="source" value="mom" />
                  Från mamma
                </label>
              </fieldset>
            </div>
            <div class="form-group text-area">
              <label for="comments">Beskriv receptet</label>
              <textarea
                id="comments"
                name="comments"
                rows="6"
                resize="no"
              ></textarea>
              <button type="submit" class="">Skicka recept</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </body>
  <footer class="footer">
    <div class="footer__content">
      <fieldset id="mode-switcher" class="theme-switcher">
        <legend class="theme-switcher__legend">Välj färgtema:</legend>

        <div class="theme-switcher__options">
          <input
            type="radio"
            name="theme"
            id="light"
            value="light"
            checked
            class="theme-switcher__input"
          />

          <label for="light" class="theme-switcher__label"> Ljust </label>

          <input
            type="radio"
            name="theme"
            id="dark"
            value="dark"
            class="theme-switcher__input"
          />

          <label for="dark" class="theme-switcher__label"> Mörkt </label>
        </div>
      </fieldset>
    </div>
  </footer>
</html>
